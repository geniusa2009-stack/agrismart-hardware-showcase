<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgriSmart Hardware Explorer</title>
<meta name="description" content="Interactive 3D explorer of the AgriSmart V4 field hardware: Sense, Control, Drip module and Connect.">
<meta property="og:image" content="preview-three-quarter.png">
<link rel="icon" type="image/png" href="explorer/favicon-64.png">
<link rel="apple-touch-icon" href="explorer/apple-touch-icon.png">
<meta name="theme-color" content="#082422">
<script>try { if (localStorage.getItem('agrismart-theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}</script>
<link rel="stylesheet" href="explorer/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c" aria-label="Interactive 3D model of AgriSmart hardware"></canvas>
<svg id="lines" aria-hidden="true"></svg>
<div id="labels"></div>

<header class="glass">
  <img src="explorer/agrismart-logo.png" alt="AgriSmart">
  <div><b>AgriSmart Hardware</b><span>V4 · Interactive explorer</span></div>
  <nav><a href="judges/">Judges portal</a><a class="opt" href="example/">Simple viewer</a>
    <button id="theme" type="button" title="Switch light / dark theme" aria-label="Switch light or dark theme">
      <svg class="i moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      <svg class="i sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button></nav>
</header>

<aside id="panel" class="glass">
  <div class="head">
    <h2><span>Components</span><span id="count"></span></h2>
    <input id="search" type="search" placeholder="Search parts, IDs, functions" autocomplete="off" aria-label="Search components">
  </div>
  <div id="list" role="listbox" aria-label="Components"></div>
  <section id="info" aria-live="polite">
    <div class="meta" id="iMeta"></div>
    <h3 id="iName"></h3>
    <div class="cid" id="iId"></div>
    <p id="iFn"></p>
    <div class="acts">
      <button class="b" id="aFocus">Focus</button>
      <button class="b" id="aIso">Isolate</button>
      <button class="b" id="aHide">Hide</button>
      <button class="b" id="aClose">Close</button>
    </div>
  </section>
</aside>

<div id="bar" class="glass" role="toolbar" aria-label="View controls">
  <button class="b" id="bReset" title="Reset view">Reset</button>
  <button class="b" id="bFit" title="Fit to screen">Fit</button>
  <button class="b" id="bShow" title="Show all parts">Show all</button>
  <span class="sep hide-m"></span>
  <label>Explode <input id="explode" type="range" min="0" max="1" step="0.01" value="0" aria-label="Exploded view"></label>
  <span class="sep hide-m"></span>
  <button class="b" id="bRotate" title="Auto-rotate">Rotate</button>
  <button class="b on hide-m" id="bLabels" title="Labels">Labels</button>
  <button class="b" id="toggleList">Parts</button>
</div>

<div id="loading"><div>Loading AgriSmart hardware<i></i></div></div>
<script type="module" src="explorer/app.js"></script>
</body>
</html>
